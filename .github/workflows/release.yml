name: Release desktop

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Pack large image assets
        run: npm run pack:assets

      - name: Build Windows installer
        run: npm run dist

      - name: Publish installer and asset packs together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          FILES=(
            dist-desktop/MapleEnchantSimulator-Setup-*.exe
            dist-desktop/latest.yml
            dist-desktop/MapleEnchantSimulator-Setup-*.exe.blockmap
            dist-assets/*
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          ls -lh "${FILES[@]}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Desktop release ${TAG}"
          fi
          for f in "${FILES[@]}"; do
            echo "Uploading ${f} ..."
            ok=0
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber; then
                ok=1
                break
              fi
              echo "Upload failed attempt ${i}, waiting before retry..."
              sleep $((i * 15))
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed to upload ${f}" >&2
              exit 1
            fi
          done
